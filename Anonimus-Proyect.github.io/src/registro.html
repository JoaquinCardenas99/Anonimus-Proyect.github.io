<!DOCTYPE html>
<html> lang="es">
<head>
    <meta charset="UTF"-8>
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title> TecnoShop - Resgistro de Usuario</title>
    <link rel="stylesheeet=" href="css/style.css">
</head>
<body> 

    <header>
        <h1> TecnoShop </h1>
        <nav>
            <a> href="index.html">Inicio</a>
            <a> href="productos.html">Productos</a>
            <a> href="registro.html">Registro</a>
            <a> href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenedor-principal">
        <h2>Crear Cuenta de Usuario</h2>
        
        <form id="formulario-registro">
            <div class="campo">
                <label for="rut-usuario">RUT (sin puntos ni guión):</label>
                <input type="text" id="rut-usuario" placeholder="12345678K" required>
            </div>

            <div class="campo">
                <label for="nombre-usuario">Nombre Completo:</label>
                <input type="text" id="nombre-usuario" required>
            </div>

            <div class="campo">
                <label for="email-usuario">Correo Electrónico:</label>
                <input type="email" id="email-usuario" placeholder="ejemplo@duoc.cl" required>
            </div>

            <div class="campo">
                <label for="select-region">Región:</label>
                <select id="select-region" required>
                    <option value="">-- Selecciona una región --</option>
                </select>
            </div>

            <div class="campo">
                <label for="select-comuna">Comuna:</label>
                <select id="select-comuna" required disabled>
                    <option value="">-- Primero selecciona una región --</option>
                </select>
            </div>

            <button type="submit" id="btn-registrar">Registrarse</button>
        </form>

        <p id="mensaje-respuesta" class="oculto"></p>

    </main>

    <script src="js/validaciones.js"></script>


</body>
</html>
